function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
function norm(s){return String(s).toUpperCase().replace(/[^0-9A-Z]/g,'');}
async function open(rawKey){
  var K=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.iv)},K,u8(D.ct));
  var html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function tryCode(code){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(code)),'PBKDF2',false,['deriveKey']);
  var kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  for(var i=0;i<D.e.length;i++){
    try{return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.e[i].i)},kek,u8(D.e[i].w)));}catch(x){}
  }
  return null;
}
