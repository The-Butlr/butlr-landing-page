function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
function norm(s){return String(s).toUpperCase().replace(/[^0-9A-Z]/g,'');}
async function open(rawKey){
  var K=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.iv)},K,u8(D.ct));
  var html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function tryCode(code){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(code)),'PBKDF2',false,['deriveKey']);
  var kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  for(var i=0;i<D.e.length;i++){
    try{return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.e[i].i)},kek,u8(D.e[i].w)));}catch(x){}
  }
  return null;
}
var saved=null;try{saved=sessionStorage.getItem('butlr-tour');}catch(x){}
var hc=norm(location.hash.slice(1));if(hc)try{history.replaceState(null,'',location.pathname);}catch(x){}
if(saved&&!hc){open(u8(saved)).catch(function(){try{sessionStorage.removeItem('butlr-tour');}catch(x){}});}
var f=document.getElementById('f'),b=document.getElementById('b'),e=document.getElementById('e'),c=document.getElementById('c');
c.addEventListener('input',function(){var v=norm(c.value).slice(0,12);c.value=v.replace(/(.{4})(?=.)/g,'$1-');e.textContent='';});
f.addEventListener('submit',async function(ev){
  ev.preventDefault();if(norm(c.value).length<12){e.textContent='The code has 12 characters.';return;}
  b.disabled=true;b.textContent='Checking…';e.textContent='';
  var k=null;try{k=await tryCode(c.value);}catch(x){}
  if(!k){b.disabled=false;b.textContent='Open the demo';e.textContent='That code didn’t work. Check it with hello@thebutlr.com.';return;}
  try{sessionStorage.setItem('butlr-tour',btoa(String.fromCharCode.apply(null,k)));sessionStorage.setItem('butlr-code',norm(c.value));}catch(x){}
  await open(k);
});
if(hc.length===12&&!saved){c.value=hc.replace(/(.{4})(?=.)/g,'$1-');f.requestSubmit?f.requestSubmit():f.dispatchEvent(new Event('submit',{cancelable:true}));}
else if(hc&&saved){open(u8(saved)).catch(function(){});}
})();
